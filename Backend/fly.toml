# fly.toml app configuration file generated for mestre-ia-backend on 2026-08-22T12:36:07-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mestre-ia-backend'
primary_region = 'gru'

[build]

# Etapa 10 (A-6) — roda uma vez por deploy, antes da nova versão receber
# tráfego (o Fly só promove a release se isto sair com sucesso). Antes
# disto, `alembic upgrade head` vivia no CMD do Dockerfile e rodava a cada
# BOOT de máquina — e a máquina desliga sozinha quando ninguém joga
# (`min_machines_running = 0` abaixo), então isso era a cada volta de um
# jogador depois de um tempo parado, não só a cada deploy.
[deploy]
  release_command = 'uv run --no-dev alembic upgrade head'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
