# Anotações para calibrar o LLM-as-judge (Etapa 6, ADR-0011).
#
# `anotador: "piloto-ia"` é reservado para o piloto que valida o FORMATO
# deste arquivo e do fluxo `run_eval.py --salvar-cache` → `evals/annotate.py`
# — feito pelo autor do harness, olhando as narrativas reais de
# `evals/cache/smoke.json` (rodada ao vivo contra a Groq, 19/08/2026).
# `evals/calibracao.py::carregar_anotacoes_humanas` EXCLUI explicitamente
# essas entradas do cálculo de concordância — elas não substituem, e não
# contam como, os ~30 exemplos anotados por uma pessoa de verdade que a
# calibração real (ainda pendente) precisa. Rode
# `uv run python -m evals.annotate --cache <arquivo> --anotador <seu-nome>`
# para anotar de verdade.
#
# Etapa 11 (B-9): `qualidade_sensorial` virou `impacto_narrativo` (a régua
# mudou de "usa 3 sentidos" pra "tem tensão e ritmo"). As notas abaixo, só
# renomeadas pra manter o schema válido, são de antes da mudança de voz —
# como já são excluídas do cálculo de concordância (`anotador == "piloto-ia"`),
# não precisam ser re-anotadas; a calibração de verdade (pendente) que vier
# depois já nasce sob a régua nova.

