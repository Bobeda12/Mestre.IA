[project]
name = "mestre-ia-backend"
version = "0.1.0"
description = "Backend do Mestre.IA — motor de RPG narrado por LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124,<0.125",
    "uvicorn[standard]>=0.38,<0.39",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "groq>=0.37,<0.38",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.uv]
package = false
