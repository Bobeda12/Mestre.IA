[project]
name = "mestre-ia-backend"
version = "0.1.0"
description = "Backend do Mestre.IA — motor de RPG narrado por LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124,<0.125",
    "uvicorn[standard]>=0.38,<0.39",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "groq>=0.37,<0.38",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "tenacity>=9.0,<10",
    "fastembed>=0.4,<1",
    "onnxruntime>=1.20",
    "rank-bm25>=0.2,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) como valor padrão de argumento é o padrão do FastAPI,
# não um bug — a "call em default" é resolvida pelo próprio framework.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
