<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mestre.IA — RPG narrado por IA</title>
    <meta name="description" content="Um RPG de mesa solo, narrado por IA — crie um herói e viva uma campanha de fantasia sombria onde o mestre não trapaceia." />

    <!-- Cartão de link. A arte é a coroa 8-bit (revisão da Etapa 14), a mesma
         que aparece na tela inicial, no login e na criação.
         O `?v=` NÃO é enfeite: as redes sociais e os apps de mensagem guardam
         a og:image em cache pela URL, por semanas. Sem trocar a URL, quem
         compartilhasse o link continuaria vendo o cartão antigo mesmo com o
         arquivo novo publicado — que foi exatamente o que aconteceu. Ao
         trocar a imagem de novo, incremente este número. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mestre.IA — RPG narrado por IA" />
    <meta property="og:description" content="Um RPG de mesa solo, narrado por IA — crie um herói e viva uma campanha de fantasia sombria onde o mestre não trapaceia." />
    <meta property="og:image" content="https://mestre-ia-seven.vercel.app/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coroa dourada em pixel art sobre fundo escuro, com o título Mestre.IA" />
    <meta property="og:url" content="https://mestre-ia-seven.vercel.app" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Alguns clientes leem só as tags twitter:* e ignoram as og:*. -->
    <meta name="twitter:title" content="Mestre.IA — RPG narrado por IA" />
    <meta name="twitter:description" content="Um RPG de mesa solo, narrado por IA — crie um herói e viva uma campanha de fantasia sombria onde o mestre não trapaceia." />
    <meta name="twitter:image" content="https://mestre-ia-seven.vercel.app/og-image.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cinzel e MedievalSharp saíram: eram as fontes de antes da identidade
         pixel e não são referenciadas em lugar nenhum do `src/` desde a
         Etapa 11 — continuavam sendo baixadas à toa em toda visita. -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
