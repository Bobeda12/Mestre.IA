services:
  - name: mestre-ia-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: Backend/Dockerfile
    dockerContext: Backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mestre-ia-seven.vercel.app
      - key: FRONTEND_URL
        value: https://mestre-ia-seven.vercel.app
      # Neon (console.neon.tech) — string de conexão do projeto Postgres.
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Etapa 14 (ADR-0023/ADR-0024) — sem cartão, em
      # aistudio.google.com/apikey. Obrigatória de verdade agora (não só
      # "opcional que degrada"): sem ela, embeddings caem para busca só
      # léxica (BM25) e a cadeia de chat perde o segundo provedor — no
      # plano free do Render, é o que mantém o processo web dentro dos
      # 512 MB (ver ADR-0023: o modelo local de embedding sozinho já
      # passava disso).
      - key: GEMINI_API_KEY
        sync: false
      # console.cloud.google.com/apis/credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # NÃO aponta pro backend direto (mestre-ia-backend.onrender.com) —
      # precisa passar pelo proxy da Vercel (Frontend/vercel.json,
      # rewrite de /api/*) pro cookie de sessão sobreviver ao redirect do
      # Google (mesma razão do ADR-0015: SameSite=Lax exige mesma origem
      # do ponto de vista do navegador).
      - key: GOOGLE_REDIRECT_URI
        value: https://mestre-ia-seven.vercel.app/api/auth/google/callback
      # Senha de app do Gmail (não a senha normal da conta) — SMTP de
      # confirmação de e-mail (ver settings.py).
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_SENHA_APP
        sync: false
      - key: CONFIRMACAO_EMAIL_URL
        value: https://mestre-ia-backend.onrender.com/auth/confirmar
      # Langfuse Cloud (região US) — opcional, tracing fica desligado sem isto.
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
