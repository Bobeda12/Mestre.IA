name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Etapa 6: permite disparar o job `avaliacao` manualmente (aba Actions do
  # GitHub → "Run workflow") — nunca dispara sozinho em push/PR. Ver o
  # comentário no job `avaliacao` abaixo.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependências
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tipos (mypy)
        run: uv run mypy app evals

      - name: Testes (pytest, com gate de cobertura em domain/services/evals)
        run: |
          uv run pytest -v \
            --cov=app/domain --cov=app/services --cov=evals \
            --cov-report=term-missing --cov-fail-under=60

  # Deploy do backend NÃO é mais um job daqui (ADR-0022: migração Fly.io →
  # Render.com). O Render tem GitHub App próprio: builda e implanta sozinho
  # a cada push em `main`, sem precisar de token nem step nenhum aqui. Esta
  # Action só continua garantindo que lint/tipos/testes passam antes disso
  # — o Render não sabe rodar essa checagem, só faz deploy do que chegar.

  avaliacao:
    # Etapa 6 (ADR-0011): gate de avaliação real contra a Groq — manual, não
    # em todo PR/push. A chave da Groq é compartilhada com os jogadores
    # (ROADMAP_PORTFOLIO.md já alerta sobre cota); rodar a suíte inteira a
    # cada commit queimaria essa cota rápido demais, e é o oposto do que o
    # próprio roadmap recomenda. Pré-requisito: secrets `GROQ_API_KEY` e
    # `GEMINI_API_KEY` configurados em Settings → Secrets do repositório
    # (ação do usuário no GitHub, fora do que este workflow consegue fazer
    # sozinho) — a partir da Etapa 14 (ADR-0024), `settings.cadeia_llm` tem
    # um elo "gemini:...", e embeddings (rag_regras.py) sempre chamam a API
    # do Gemini; sem a segunda chave, o `--bake-off` pula esse elo e a
    # avaliação roda só com busca léxica (BM25), não o caminho de produção
    # completo.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependências
        run: uv sync

      - name: Rodar a suíte de avaliação contra o baseline salvo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m evals.run_eval --comparar-baseline --salvar-relatorio relatorio.json

      - name: Publicar o relatório da rodada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-avaliacao
          path: Backend/relatorio.json
